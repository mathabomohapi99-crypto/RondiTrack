name: ronditrack-e2e

# Same image for migrate, seed and api. Every secret comes from the environment: nothing real is stored here.
x-api: &api
  image: ronditrack-api:e2e
  build:
    context: .
    dockerfile: API/Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8080
    ConnectionStrings__RondiTrack: Host=db;Port=5432;Database=ronditrack;Username=postgres;Password=${E2E_DB_PASSWORD:?set E2E_DB_PASSWORD}
    Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
    E2e__Password: ${E2E_PASSWORD:?set E2E_PASSWORD}
    # test-only: a normal login limit is 5 a minute per IP, which three sign-ins per run and many runs would hit
    RateLimiting__Login__PermitLimit: "1000"
    RateLimiting__Contribution__TokenLimit: "1000"
    RateLimiting__Payout__TokenLimit: "1000"
    RateLimiting__Invite__TokenLimit: "1000"
    Jobs__CycleClose__Enabled: "false"   # the nightly job must not close the test cycles

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ronditrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?set E2E_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ronditrack"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api
    command: ["--migrate"]
    depends_on:
      db: { condition: service_healthy }

  seed:
    <<: *api
    command: ["--seed-e2e"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    <<: *api
    ports:
      - "5134:8080"
    depends_on:
      seed: { condition: service_completed_successfully }